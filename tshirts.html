<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-Shirts — ORIGYN</title>
  <style>
    :root { --color-bg: #f8f9fa; --color-card-bg: #ffffff; --color-border: #e0e0e0; --color-text-dark: #1a1a1a; --color-text-muted: #6c757d; --font-primary: 'Georgia', serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--color-bg); color: var(--color-text-dark); font-family: var(--font-primary); display: flex; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    aside.sidebar { width: 260px; background-color: #ffffff; border-right: 1px solid var(--color-border); padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; }
    .brand-logo { height: 45px; width: auto; margin-bottom: 30px; filter: invert(1); }
    .search-input { width: 100%; padding: 10px; border: 1px solid var(--color-border); font-family: var(--font-primary); font-size: 0.85rem; outline: none; margin-bottom: 25px; }
    .nav-links { list-style: none; display: flex; flex-direction: column; gap: 15px; }
    .nav-links a { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: bold; }
    .nav-links a:hover, .nav-links a.active { color: var(--color-text-muted); }
    main.content { margin-left: 260px; flex: 1; padding: 40px; }
    .search-results-panel { display: none; background: var(--color-card-bg); border: 1px solid var(--color-border); padding: 20px; margin-bottom: 30px; }
    .search-results-panel.active { display: block; }
    .search-item { padding: 10px 0; border-bottom: 1px solid var(--color-border); }
    .page-title { font-size: 1.8rem; letter-spacing: 0.1em; margin-bottom: 30px; text-transform: uppercase; }
    .product-card { background-color: var(--color-card-bg); border: 1px solid var(--color-border); padding: 40px 25px; text-align: center; max-width: 320px; }
    .product-card h3 { font-size: 1.2rem; margin-bottom: 10px; }
    .product-card p { font-size: 0.9rem; color: var(--color-text-muted); }
    .contacts-section { margin-top: 60px; padding: 30px; background: var(--color-card-bg); border: 1px solid var(--color-border); }
    .contacts-section h3 { font-size: 1.1rem; letter-spacing: 0.1em; margin-bottom: 15px; text-transform: uppercase; }
    .contacts-list { list-style: none; font-size: 0.9rem; color: var(--color-text-muted); display: flex; flex-direction: column; gap: 8px; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--color-border); font-size: 0.75rem; color: var(--color-text-muted); text-align: center; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="index.html"><img src="logo.png" alt="ORIGYN Logo" class="brand-logo"></a>
    <input type="text" id="searchInput" class="search-input" placeholder="Search..." oninput="handleSearch()">
    <ul class="nav-links">
      <li><a href="index.html">Main Page</a></li>
      <li><a href="hoodies.html">Hoodies</a></li>
      <li><a href="tshirts.html" class="active">T-Shirts</a></li>
      <li><a href="accessories.html">Bags & Accessories</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
  </aside>
  <main class="content">
    <div id="searchResultsPanel" class="search-results-panel">
      <h3 style="margin-bottom: 15px;">Search Results</h3>
      <div id="searchResultsList"></div>
    </div>
    <h1 class="page-title">T-Shirts</h1>
    <div class="product-card">
      <h3>Shirt Test 01</h3>
      <p>Premium Cotton T-Shirt</p>
    </div>

    <!-- CONTACTS SECTION -->
    <section class="contacts-section">
      <h3>Contact Us</h3>
      <ul class="contacts-list">
        <li><strong>Email:</strong> support@origyn.com</li>
        <li><strong>Phone:</strong> +44 20 1234 5678</li>
        <li><strong>Instagram:</strong> @origyn_apparel</li>
      </ul>
    </section>

    <footer>
      &copy; ORIGYN. All rights reserved. Made in Europe.
    </footer>
  </main>
  <script>
    const catalog = [
      { name: "Shirt Test 01", category: "T-Shirts", link: "tshirts.html" },
      { name: "shirt test 02", category: "Hoodies", link: "hoodies.html" },
      { name: "accessory test 01", category: "Bags & Accessories", link: "accessories.html" }
    ];
    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const panel = document.getElementById('searchResultsPanel');
      const list = document.getElementById('searchResultsList');
      if (query === '') { panel.classList.remove('active'); list.innerHTML = ''; return; }
      const matches = catalog.filter(item => item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query));
      panel.classList.add('active');
      if (matches.length > 0) {
        list.innerHTML = matches.map(item => `<div class="search-item"><a href="${item.link}"><strong>${item.name}</strong> — <small>${item.category}</small></a></div>`).join('');
      } else { list.innerHTML = '<p class="search-item">No items found.</p>'; }
    }
  </script>
</body>
</html>
