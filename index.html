<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance Bash - スタジオクラス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Dance Bash</div>
    <nav>
      <a href="index.html">クラス</a>
      <a href="events.html">イベント</a>
      <a href="merch.html">グッズ</a>
      <a href="cart.html">🛒 カート (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <h2>スタジオクラス</h2>
    <div class="grid">
      <div class="card">
        <h3>ヒップホップ初級</h3>
        <p>基本のリズムとシンプルな振付を学びます。</p>
        <div class="price">$20.00</div>
        <button class="btn-add" onclick="addToCart('c1', 'ヒップホップ初級', 20)">カートに追加</button>
      </div>
      <div class="card">
        <h3>上級コレオグラフィー</h3>
        <p>経験者向けのハイレベルなルーティンクラス。</p>
        <div class="price">$25.00</div>
        <button class="btn-add" onclick="addToCart('c2', '上級コレオグラフィー', 25)">カートに追加</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
