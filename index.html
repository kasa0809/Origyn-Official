<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance Bash - Studio Classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Dance Bash</div>
    <nav>
      <a href="index.html">Classes</a>
      <a href="events.html">Events</a>
      <a href="merch.html">Merch</a>
      <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <h2>Studio Classes</h2>
    <div class="grid">
      <div class="card">
        <h3>Hip Hop Beginner</h3>
        <p>Learn fundamental grooves and simple choreo.</p>
        <div class="price">$20.00</div>
        <button class="btn-add" onclick="addToCart('c1', 'Hip Hop Beginner', 20)">Add to Cart</button>
      </div>
      <div class="card">
        <h3>Advanced Choreography</h3>
        <p>Fast-paced routine for experienced dancers.</p>
        <div class="price">$25.00</div>
        <button class="btn-add" onclick="addToCart('c2', 'Advanced Choreography', 25)">Add to Cart</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
