<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance Bash - イベント</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Dance Bash</div>

      <a href="merch.html">グッズ</a>

      <div class="card">
        <h3>VIP 成果発表会チケット</h3>
        <p>年次発表会を最前列で観覧できるプレミアムチケット。</p>
        <div class="price">$35.00</div>
        <button class="btn-add" onclick="addToCart('e2', 'VIP 成果発表会チケット', 35)">カートに追加</button>
      </div>
    </div>

  <script src="script.js"></script>
